limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
server { listen 80; return 301 https://$host$request_uri; }
server {
  listen 443 ssl;
  http2 on;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 64k;
  location /metrics { deny all; }
  location /ws { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location / { limit_req zone=api burst=40 nodelay; proxy_pass http://api:8000; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; }
}
